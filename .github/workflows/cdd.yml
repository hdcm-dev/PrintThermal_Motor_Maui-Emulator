# CI pública del emulador (runners de GitHub, ADR-0006).
# Las compuertas de CDD se corren en local, con la norma CDD (repositorio privado) en el commit del lock:
# esta CI no descarga la norma ni guarda credenciales (decisión P5 B de la visión, DEC-006).
# Hasta que exista la solución (PAR-PTE-01) queda sólo manual; PAR-PTE-01 la convierte en compilación y pruebas .NET.
name: cdd
on:
  workflow_dispatch:
jobs:
  compuertas-locales:
    runs-on: ubuntu-latest
    steps:
      - name: Dónde corren las compuertas
        run: echo "Las compuertas de CDD se corren en local (AGENTS.md, DEC-006); todavía no hay solución .NET que compilar."
